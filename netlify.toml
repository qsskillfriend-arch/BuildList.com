# ═══════════════════════════════════════════════════════════════
# BuildList.com — Netlify configuration
#
# This repository deploys to EITHER Netlify or Vercel without change.
# The form endpoint is /api/form on both: here _redirects maps it to
# netlify/functions/form.mjs, on Vercel it is api/form.js. Both import
# the same lib/form-core.js, so behaviour is identical.
# ═══════════════════════════════════════════════════════════════

[build]
  publish = "."
  command = "node supabase/pull.js && node build.js"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Set SITE_URL, SUPABASE_* and the form delivery variables in
  # Site configuration → Environment variables.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "SAMEORIGIN"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://unpkg.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.github.com https://esm.sh https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://stats.g.doubleclick.net https://*.tile.openstreetmap.org; media-src 'self' blob: https://*.supabase.co; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

# Generated pages revalidate so a data change is live immediately
[[headers]]
  for = "/firms/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/browse/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type  = "application/json; charset=utf-8"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Video needs byte-range support so a viewer can scrub without
# downloading the whole file.
[[headers]]
  for = "/images/ads/*.mp4"
  [headers.values]
    Accept-Ranges = "bytes"
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=43200"

# The portal has a real login but should not be indexed
[[headers]]
  for = "/portal.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag  = "noindex, nofollow"
